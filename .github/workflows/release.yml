name: release

# Build and package all four targets before drafting a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload artifacts, but do not create a release'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            archive: tar.gz
          - name: linux-x86_64
            runner: ubuntu-24.04
            archive: tar.gz
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - name: windows-x86_64
            runner: windows-2022
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ninja llvm

      - name: Install MSYS2 for ffmpeg's configure (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: make diffutils tar xz curl
          path-type: inherit

      - name: Build ffmpeg (Windows)
        if: runner.os == 'Windows'
        working-directory: smstrikers-port
        shell: msys2 {0}
        run: ./tools/build-ffmpeg.sh

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ffmpeg

      - name: Install Qt (settings app)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev
      - name: Point package.sh at the distro Qt (Linux)
        if: runner.os == 'Linux'
        run: echo "QT_PREFIX=/usr" >> "$GITHUB_ENV"
      - name: Set the glibc ceiling (Linux)
        if: runner.os == 'Linux'
        run: echo "STRIKERS_MAX_GLIBC=2.35" >> "$GITHUB_ENV"

      - name: Tool tests
        working-directory: smstrikers-port
        shell: bash
        run: |
          python3 tools/test_genstubs.py
          python3 tools/test_extract_disc.py

      - name: Configure
        if: runner.os != 'Linux'
        working-directory: smstrikers-port
        shell: bash
        run: ./tools/configure.sh build-aur Release

      - name: Build
        if: runner.os != 'Linux'
        working-directory: smstrikers-port
        shell: bash
        run: ./tools/rebuild.sh build-aur

      - name: Configure and build (Linux, in Ubuntu 22.04)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE/smstrikers-port" ubuntu:22.04 sh -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              ./tools/install-linux-deps.sh
              ./tools/build-ffmpeg.sh
              ./tools/configure.sh build-aur Release
              ./tools/rebuild.sh build-aur
              chown -R '"$(id -u):$(id -g)"' .'

      - name: Package
        working-directory: smstrikers-port
        shell: bash
        run: ./tools/package.sh build-aur "strikers-${{ matrix.name }}" "${{ matrix.archive }}"

      # Unarchived, so a downloaded artifact is the archive itself rather than a zip holding it.
      - uses: actions/upload-artifact@v7
        with:
          path: smstrikers-port/dist/strikers-${{ matrix.name }}.${{ matrix.archive }}
          archive: false
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    if: >-
      success() && startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # skip-decompress, or the Windows zip is served as application/zip and unpacked loose.
      - uses: actions/download-artifact@v8
        with:
          pattern: strikers-*
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Verify archives and write checksums
        working-directory: artifacts
        run: |
          set -eu
          for archive in strikers-macos-arm64.tar.gz strikers-linux-x86_64.tar.gz strikers-linux-arm64.tar.gz strikers-windows-x86_64.zip; do
            test -s "$archive"
          done
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
          body: |
            Built from ${{ github.sha }}.

            Disc data is not bundled. Unpack an archive, put the extracted
            disc's `files/` directory beside the executable, and run it.
            The player instructions are included in the archive.

            These are experimental builds for macOS arm64, Linux x86-64,
            Linux arm64 and Windows x86-64.
            Linux builds need glibc 2.35 or newer: Ubuntu 22.04, Debian 12,
            Fedora 36, current SteamOS, or anything later.
            Verify downloads against SHA256SUMS. Test the packaged builds
            before publishing this draft.
